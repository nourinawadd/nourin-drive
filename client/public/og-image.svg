<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" shape-rendering="crispEdges">
  <defs>
    <pattern id="desktop" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#0055aa"/>
      <rect x="6" width="6" height="6" fill="#114488"/>
      <rect y="6" width="6" height="6" fill="#114488"/>
      <rect x="6" y="6" width="6" height="6" fill="#0055aa"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="64" y="92" width="880" height="302"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#desktop)"/>

  <g aria-label="Workbench menu bar">
    <rect width="1200" height="38" fill="#000"/>
    <rect y="2" width="1200" height="32" fill="#cfcfcf"/>
    <rect y="4" width="1200" height="2" fill="#fff"/>
    <rect y="34" width="1200" height="4" fill="#555"/>
    <text x="28" y="27" fill="#000" font-family="VT323, 'Lucida Console', monospace" font-size="28">NOURIN-DRIVE: Workbench</text>
    <text x="1138" y="28" fill="#000" text-anchor="middle" font-family="VT323, 'Lucida Console', monospace" font-size="28">✦</text>
  </g>

  <g transform="translate(96 104)" aria-label="Nourin Drive preview window">
    <rect x="14" y="14" width="1008" height="428" fill="#000" opacity="0.45"/>
    <rect width="1008" height="428" fill="#000"/>
    <rect x="0" y="0" width="998" height="418" fill="#cfcfcf"/>
    <rect x="10" y="10" width="978" height="398" fill="#aaaaaa"/>

    <rect x="10" y="10" width="978" height="36" fill="#ff8800"/>
    <rect x="10" y="44" width="978" height="4" fill="#000"/>
    <rect x="20" y="18" width="24" height="18" fill="#cfcfcf"/>
    <rect x="54" y="20" width="904" height="3" fill="#cc6611"/>
    <rect x="54" y="32" width="904" height="3" fill="#fff"/>
    <text x="499" y="37" fill="#000" text-anchor="middle" font-family="VT323, 'Lucida Console', monospace" font-size="30">NOURIN-DRIVE:</text>

    <rect x="54" y="82" width="900" height="322" fill="#000"/>
    <rect x="64" y="92" width="880" height="302" fill="#0055aa"/>
    <rect x="64" y="92" width="880" height="302" fill="url(#desktop)" opacity="0.68"/>

    <g transform="translate(92 126) scale(3)" aria-label="System disk icon">
      <rect x="4" y="38" width="50" height="1" fill="#000"/>
      <rect x="53" y="3" width="1" height="36" fill="#000"/>
      <rect x="3" y="2" width="50" height="37" fill="#000"/>
      <rect x="4" y="3" width="48" height="35" fill="#cfcfcf"/>
      <rect x="4" y="3" width="48" height="1" fill="#fff"/>
      <rect x="4" y="3" width="1" height="35" fill="#fff"/>
      <rect x="51" y="3" width="1" height="35" fill="#555"/>
      <rect x="4" y="37" width="48" height="1" fill="#555"/>
      <rect x="5" y="4" width="46" height="6" fill="#3b67a4"/>
      <rect x="5" y="9" width="46" height="1" fill="#000"/>
      <rect x="5" y="10" width="46" height="20" fill="#fff"/>
      <rect x="5" y="30" width="46" height="7" fill="#aaa"/>
      <rect x="9" y="33" width="38" height="4" fill="#000"/>
      <rect x="10" y="34" width="36" height="2" fill="#555"/>
      <rect x="14" y="34" width="28" height="2" fill="#cfcfcf"/>
      <text x="28" y="26" text-anchor="middle" fill="#000" font-family="'Lucida Console', monospace" font-size="16">✦</text>
    </g>
    <text x="176" y="332" fill="#fff" text-anchor="middle" font-family="VT323, 'Lucida Console', monospace" font-size="32">System:</text>

    <g clip-path="url(#screenClip)">
      <text x="374" y="206" fill="#fff" font-family="VT323, 'Lucida Console', monospace" font-size="76" textLength="560" lengthAdjust="spacingAndGlyphs">NOURIN-DRIVE:</text>
      <text x="378" y="270" fill="#fff" font-family="VT323, 'Lucida Console', monospace" font-size="38" textLength="536" lengthAdjust="spacingAndGlyphs">a personal computer on the internet</text>
      <rect x="382" y="304" width="420" height="6" fill="#ff8800"/>
      <text x="378" y="350" fill="#cfcfcf" font-family="VT323, 'Lucida Console', monospace" font-size="34">nourin.is-a.dev</text>
    </g>
  </g>
</svg>