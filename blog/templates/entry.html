  <article class="entry">
    <div class="post-num-row">
      <span>{{number}}</span>
      <span>{{dateLong}}</span>
    </div>
    <h2 class="post-title"><a href="/posts/{{slug}}.html">{{title}}</a></h2>
    <div class="meta">{{meta}}</div>
    <p class="entry-summary">{{summary}}</p>
    <a class="more" href="/posts/{{slug}}.html">read on &rarr;</a>
  </article>
