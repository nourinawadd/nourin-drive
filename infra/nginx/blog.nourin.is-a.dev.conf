server {
    listen 80;
    listen [::]:80;
    server_name blog.nourin.is-a.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.nourin.is-a.dev;

    ssl_certificate     /etc/letsencrypt/live/blog.nourin.is-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.nourin.is-a.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/blog;
    index index.html;

    add_header Content-Security-Policy "frame-ancestors 'self' https://nourin.is-a.dev" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(html|css|js|json|xml)$ {
        add_header Content-Security-Policy "frame-ancestors 'self' https://nourin.is-a.dev" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    location /img/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /feed.xml {
        default_type application/rss+xml;
        add_header Cache-Control "no-cache" always;
    }

    location = /atom.xml {
        default_type application/atom+xml;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
