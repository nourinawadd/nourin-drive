server {
    listen 80;
    listen [::]:80;
    server_name nourin.is-a.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nourin.is-a.dev;

    ssl_certificate     /etc/letsencrypt/live/nourin.is-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nourin.is-a.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/nourin;
    index index.html;

    # nginx.conf has `gzip on` but never sets gzip_types, whose default is
    # text/html alone - so every js/css/json byte was going out raw. gzip_static
    # additionally prefers a pre-built <file>.gz when one exists, which is how
    # the 50MB godot wasm ships as 10MB without burning CPU per request on a
    # 2-core box.
    gzip_types text/plain text/css application/javascript text/javascript
               application/json image/svg+xml application/xml application/wasm
               audio/wav;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_static on;

    location = /x7fnq4v {
        try_files $uri.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location = /x7fnq4v.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location = /x7fnq4v.wav {
        default_type audio/wav;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location /terminal {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # nginx 1.18's mime.types knows neither extension. .mjs served as
    # octet-stream makes the browser refuse the pdf.js worker outright
    # ("Failed to fetch dynamically imported module"), and .wasm without
    # application/wasm drops Godot from streaming compile to buffering the
    # whole 50MB module. Both rules must stay above the media block below,
    # because nginx takes the first matching regex location.
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Godot / Unity builds ship pre-compressed .br and .gz that the engine
    # loader fetches directly. Without these the browser hands the loader raw
    # compressed bytes and it fails with "Unable to parse ...br". This replaces
    # the headers() block that next.config.ts used before the static export.
    location ~* ^/games/.+\.br$ {
        add_header Content-Encoding br always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        default_type application/octet-stream;
    }

    location ~* ^/games/.+\.gz$ {
        add_header Content-Encoding gzip always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        default_type application/octet-stream;
    }

    # Content-addressed or write-once, so it can never change under a stable
    # name.
    location ~* ^/(music|games|images|sfx)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # These change under stable filenames - a replaced book, a re-cropped photo,
    # a regenerated worker. "immutable" here strands every returning visitor on
    # the old copy for a year, so revalidate instead.
    location ~* ^/(library|gallery|vendor)/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
