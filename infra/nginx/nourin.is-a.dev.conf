server {
    listen 80;
    listen [::]:80;
    server_name nourin.is-a.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nourin.is-a.dev;

    ssl_certificate     /etc/letsencrypt/live/nourin.is-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nourin.is-a.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/nourin;
    index index.html;

    location /terminal {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # Godot / Unity builds ship pre-compressed .br and .gz that the engine
    # loader fetches directly. Without these the browser hands the loader raw
    # compressed bytes and it fails with "Unable to parse ...br". This replaces
    # the headers() block that next.config.ts used before the static export.
    location ~* ^/games/.+\.br$ {
        add_header Content-Encoding br always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        default_type application/octet-stream;
    }

    location ~* ^/games/.+\.gz$ {
        add_header Content-Encoding gzip always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        default_type application/octet-stream;
    }

    location ~* ^/(music|games|gallery|images|sfx|library|vendor)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
