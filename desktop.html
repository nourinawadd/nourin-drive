<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetroDesk OS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    background: linear-gradient(135deg, #0a9b8a 0%, #12b89e 40%, #1ec8a8 70%, #0e9e84 100%);
  }

  /* ── Desktop ── */
  #desktop {
    width: 100%; height: calc(100% - 36px);
    position: relative;
    padding: 16px;
    display: flex;
    flex-direction: column;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 8px;
  }

  /* ── Desktop Icons ── */
  .desktop-icon {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    width: 72px; padding: 6px 4px; border-radius: 2px;
    cursor: pointer; color: white; text-align: center;
    transition: background 0.1s;
  }
  .desktop-icon:hover { background: rgba(255,255,255,0.2); }
  .desktop-icon.selected { background: rgba(255,255,255,0.3); outline: 1px dotted rgba(255,255,255,0.8); }
  .desktop-icon .icon-img {
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.3));
  }
  .desktop-icon .icon-label {
    font-size: 10.5px; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    line-height: 1.2; word-break: break-word;
  }

  /* ── Taskbar ── */
  #taskbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 36px;
    background: #d4d0c8;
    border-top: 2px solid #fff;
    display: flex; align-items: center;
    padding: 0 4px;
    gap: 3px;
    z-index: 9999;
    box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 #808080;
  }

  #start-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 3px 8px; height: 26px;
    background: #d4d0c8;
    border: 1px solid;
    border-color: #fff #808080 #808080 #fff;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600; font-size: 12px;
    cursor: pointer; white-space: nowrap;
  }
  #start-btn:active { border-color: #808080 #fff #fff #808080; }
  #start-btn .logo { font-size: 14px; }

  .taskbar-sep {
    width: 2px; height: 26px;
    border-left: 1px solid #808080;
    border-right: 1px solid #fff;
    margin: 0 2px;
  }

  .taskbar-apps { display: flex; gap: 3px; flex: 1; }

  .taskbar-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 3px 8px; height: 26px; min-width: 120px; max-width: 160px;
    background: #d4d0c8;
    border: 1px solid;
    border-color: #fff #808080 #808080 #fff;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: background 0.05s;
  }
  .taskbar-btn.active {
    border-color: #808080 #fff #fff #808080;
    background: #bdbbb3;
  }
  .taskbar-btn:hover { background: #e0ddd5; }
  .taskbar-btn .tb-icon { font-size: 14px; flex-shrink: 0; }

  .taskbar-right {
    display: flex; align-items: center; gap: 4px;
    padding: 0 6px; height: 26px;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    background: #d4d0c8;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
  }

  /* ── Window ── */
  .window {
    position: absolute;
    background: #d4d0c8;
    border: 1px solid;
    border-color: #fff #808080 #808080 #fff;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.4), inset 0 0 0 1px #bdbbb3;
    min-width: 300px; min-height: 200px;
    display: flex; flex-direction: column;
    resize: none;
  }
  .window.focused {
    box-shadow: 3px 3px 12px rgba(0,0,0,0.5), inset 0 0 0 1px #bdbbb3;
    z-index: 1000;
  }
  .window.minimized { display: none; }

  /* Title Bar */
  .win-titlebar {
    display: flex; align-items: center;
    padding: 3px 3px 3px 6px; gap: 4px;
    background: linear-gradient(to right, #2a6496, #5b9bd5);
    cursor: move; flex-shrink: 0; height: 24px;
  }
  .window:not(.focused) .win-titlebar {
    background: linear-gradient(to right, #7a8a9a, #a0afbd);
  }
  .win-title {
    flex: 1; color: white; font-size: 11px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    pointer-events: none;
  }
  .win-controls { display: flex; gap: 2px; flex-shrink: 0; }
  .win-btn {
    width: 18px; height: 16px;
    border: 1px solid;
    border-color: #fff #808080 #808080 #fff;
    background: #d4d0c8;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 9px; font-weight: 700;
    font-family: 'IBM Plex Sans', sans-serif;
    color: #1a1a1a;
  }
  .win-btn:active { border-color: #808080 #fff #fff #808080; }
  .win-btn.lt { background: #1a6bb5; color: white; font-size: 8px; font-weight: 700; }
  .win-btn.dk { background: #6a7a8a; color: white; font-size: 8px; font-weight: 700; }
  .win-btn.close { background: #c0392b; color: white; font-size: 11px; }

  /* Menu Bar */
  .win-menubar {
    display: flex; gap: 0; padding: 2px 4px;
    background: #d4d0c8; border-bottom: 1px solid #808080;
    flex-shrink: 0;
  }
  .menu-item {
    padding: 2px 8px; font-size: 11px; cursor: pointer; border-radius: 0;
  }
  .menu-item:hover { background: #2a6496; color: white; }

  /* Window Content */
  .win-body {
    flex: 1; overflow: hidden; display: flex; flex-direction: column;
    background: #d4d0c8;
  }

  /* ── Resize Handle ── */
  .win-resize {
    position: absolute; bottom: 0; right: 0;
    width: 12px; height: 12px; cursor: se-resize;
    background: linear-gradient(135deg, transparent 50%, #808080 50%);
  }

  /* ═══════════════════════════════════════
     APP: FILE EXPLORER
  ═══════════════════════════════════════ */
  .explorer-toolbar {
    display: flex; align-items: center; gap: 4px; padding: 4px 6px;
    border-bottom: 1px solid #808080;
    background: #d4d0c8; flex-shrink: 0;
  }
  .explorer-toolbar button {
    padding: 2px 8px; font-size: 11px; font-family: inherit;
    border: 1px solid; border-color: #fff #808080 #808080 #fff;
    background: #d4d0c8; cursor: pointer;
  }
  .explorer-toolbar button:active { border-color: #808080 #fff #fff #808080; }
  .explorer-address {
    flex: 1; display: flex; align-items: center; gap: 4px;
    font-size: 11px;
  }
  .explorer-address label { white-space: nowrap; color: #333; }
  .explorer-address input {
    flex: 1; height: 18px; padding: 0 4px; font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    border: 1px solid; border-color: #808080 #fff #fff #808080;
    background: white; outline: none;
  }
  .explorer-layout { display: flex; flex: 1; overflow: hidden; }
  .explorer-sidebar {
    width: 140px; border-right: 1px solid #808080;
    padding: 6px 4px; overflow-y: auto; flex-shrink: 0;
    background: #d4d0c8;
  }
  .sidebar-section { font-size: 10px; font-weight: 600; color: #333; padding: 4px 4px 2px; border-bottom: 1px solid #aaa; margin-bottom: 4px; }
  .sidebar-item {
    display: flex; align-items: center; gap: 4px;
    padding: 2px 4px; font-size: 11px; cursor: pointer; border-radius: 0;
    color: #1a1a1a;
  }
  .sidebar-item:hover { background: #2a6496; color: white; }
  .sidebar-item span:first-child { font-size: 13px; }
  .explorer-main {
    flex: 1; padding: 8px; overflow-y: auto; background: white;
    display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start;
  }
  .file-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    width: 64px; padding: 6px 4px; cursor: pointer; border: 1px solid transparent;
    text-align: center;
  }
  .file-item:hover { background: #d0e4f7; border-color: #5b9bd5; }
  .file-item.selected { background: #b8d4f0; border-color: #2a6496; }
  .file-item .fi-icon { font-size: 28px; }
  .file-item .fi-name { font-size: 10px; color: #1a1a1a; line-height: 1.2; word-break: break-word; }
  .explorer-statusbar {
    padding: 2px 8px; font-size: 10px; color: #444;
    border-top: 1px solid #808080; background: #d4d0c8; flex-shrink: 0;
  }

  /* ═══════════════════════════════════════
     APP: BROWSER
  ═══════════════════════════════════════ */
  .browser-bar {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 6px; border-bottom: 1px solid #808080;
    background: #d4d0c8; flex-shrink: 0;
  }
  .browser-bar button {
    width: 22px; height: 20px; font-size: 11px;
    border: 1px solid; border-color: #fff #808080 #808080 #fff;
    background: #d4d0c8; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .browser-bar button:active { border-color: #808080 #fff #fff #808080; }
  .browser-bar button:disabled { color: #888; cursor: default; }
  .url-bar {
    flex: 1; height: 20px; padding: 0 6px;
    font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    border: 1px solid; border-color: #808080 #fff #fff #808080;
    background: white; outline: none;
  }
  .go-btn {
    padding: 2px 8px; height: 20px; font-size: 11px; font-family: inherit;
    border: 1px solid; border-color: #fff #808080 #808080 #fff;
    background: #d4d0c8; cursor: pointer;
  }
  .browser-tabs {
    display: flex; gap: 1px; padding: 3px 6px 0; background: #bdbbb3; flex-shrink: 0;
  }
  .browser-tab {
    padding: 3px 12px; font-size: 11px; background: #d4d0c8;
    border: 1px solid; border-color: #fff #808080 transparent #fff;
    cursor: pointer; min-width: 80px; max-width: 140px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    position: relative; bottom: -1px; z-index: 1;
  }
  .browser-tab.active { background: #d4d0c8; border-bottom-color: #d4d0c8; z-index: 2; }
  .browser-content {
    flex: 1; background: white; overflow: hidden; display: flex;
    align-items: center; justify-content: center; flex-direction: column;
    font-size: 12px; color: #555; gap: 8px;
  }
  .browser-page { width: 100%; height: 100%; padding: 20px; overflow-y: auto; }
  .browser-hero { background: linear-gradient(135deg, #0a9b8a, #1ec8a8); color: white; padding: 40px; margin-bottom: 20px; }
  .browser-hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .browser-hero p { font-size: 13px; opacity: 0.9; }
  .browser-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .browser-card { border: 1px solid #d4d0c8; padding: 12px; font-size: 11px; }
  .browser-card h3 { font-size: 12px; margin-bottom: 6px; color: #2a6496; }

  /* ═══════════════════════════════════════
     APP: SPOTIFY
  ═══════════════════════════════════════ */
  .spotify-layout { display: flex; flex: 1; overflow: hidden; }
  .spotify-sidebar {
    width: 200px; background: #1a1a1a; color: #b3b3b3;
    padding: 8px 0; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0;
  }
  .sp-section { font-size: 10px; font-weight: 700; color: #888; padding: 8px 16px 4px; text-transform: uppercase; letter-spacing: 1px; }
  .sp-nav-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 16px;
    font-size: 12px; cursor: pointer; color: #b3b3b3;
  }
  .sp-nav-item:hover { color: white; }
  .sp-nav-item.active { color: white; font-weight: 600; }
  .sp-nav-item .sp-icon { font-size: 16px; }
  .spotify-main { flex: 1; background: #121212; overflow-y: auto; padding: 20px; }
  .sp-hero { background: linear-gradient(180deg, #1a4a3a 0%, #121212 100%); padding: 20px; margin: -20px -20px 20px; }
  .sp-hero h2 { color: white; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .sp-hero p { color: #b3b3b3; font-size: 11px; }
  .sp-section-title { color: white; font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .sp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .sp-card { background: #282828; padding: 12px; cursor: pointer; border-radius: 4px; transition: background 0.2s; }
  .sp-card:hover { background: #3a3a3a; }
  .sp-card .sp-cover { width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, #1db954 0%, #0a9b8a 100%); margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 36px; border-radius: 2px; }
  .sp-card .sp-card-name { color: white; font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .sp-card .sp-card-sub { color: #b3b3b3; font-size: 10px; }
  .spotify-player {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #181818; border-top: 1px solid #282828;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .sp-now { display: flex; align-items: center; gap: 8px; width: 200px; flex-shrink: 0; }
  .sp-thumb { width: 40px; height: 40px; background: linear-gradient(135deg, #1db954, #0a9b8a); display: flex; align-items: center; justify-content: center; font-size: 20px; border-radius: 2px; flex-shrink: 0; }
  .sp-track-info .sp-track-name { color: white; font-size: 11px; font-weight: 600; }
  .sp-track-info .sp-track-artist { color: #b3b3b3; font-size: 10px; }
  .sp-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sp-controls { display: flex; align-items: center; gap: 12px; }
  .sp-ctrl-btn { background: none; border: none; color: #b3b3b3; cursor: pointer; font-size: 14px; padding: 4px; }
  .sp-ctrl-btn:hover { color: white; }
  .sp-play-btn {
    width: 30px; height: 30px; border-radius: 50%; background: white;
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 12px; color: #121212;
  }
  .sp-progress { width: 100%; display: flex; align-items: center; gap: 6px; }
  .sp-time { color: #b3b3b3; font-size: 10px; font-family: 'IBM Plex Mono', monospace; }
  .sp-bar { flex: 1; height: 3px; background: #4a4a4a; border-radius: 2px; position: relative; cursor: pointer; }
  .sp-bar-fill { height: 100%; background: #1db954; border-radius: 2px; width: 35%; }

  /* ═══════════════════════════════════════
     APP: TERMINAL
  ═══════════════════════════════════════ */
  .terminal-body {
    flex: 1; background: #1a1a1a; padding: 8px;
    overflow-y: auto; font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: #33ff33;
    display: flex; flex-direction: column; gap: 2px;
  }
  .term-line { line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
  .term-line.prompt { color: #33ff33; }
  .term-line.output { color: #cccccc; }
  .term-line.error { color: #ff4444; }
  .term-line.dim { color: #888; }
  .term-input-row { display: flex; align-items: center; margin-top: 2px; }
  .term-prompt-sym { color: #33ff33; font-family: 'IBM Plex Mono', monospace; font-size: 12px; white-space: nowrap; }
  .term-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #33ff33; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    caret-color: #33ff33;
  }

  /* ═══════════════════════════════════════
     APP: PORTFOLIO (like the screenshot)
  ═══════════════════════════════════════ */
  .portfolio-layout { display: flex; flex: 1; overflow: hidden; font-family: 'IBM Plex Mono', monospace; }
  .pf-collection {
    width: 190px; flex-shrink: 0; border-right: 1px solid #808080;
    display: flex; flex-direction: column;
  }
  .pf-col-header { padding: 6px 8px; font-size: 10px; font-weight: 700; color: #444; background: #c8c5bc; border-bottom: 1px solid #808080; text-transform: uppercase; }
  .pf-endpoints-header { padding: 4px 8px; font-size: 10px; font-weight: 700; color: #333; background: #d4d0c8; border-bottom: 1px solid #aaa; }
  .pf-endpoint-item { padding: 6px 8px; border-bottom: 1px solid #ccc; cursor: pointer; }
  .pf-endpoint-item:hover, .pf-endpoint-item.active { background: #b8d4f0; }
  .pf-endpoint-row { display: flex; gap: 6px; font-size: 10px; margin-bottom: 2px; }
  .pf-method { color: #2a6496; font-weight: 700; font-size: 10px; }
  .pf-path { color: #333; font-size: 10px; font-weight: 600; }
  .pf-desc { font-size: 10px; color: #666; line-height: 1.3; font-family: 'IBM Plex Sans', sans-serif; }
  .pf-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .pf-request { padding: 8px; border-bottom: 1px solid #808080; flex-shrink: 0; }
  .pf-section-title { font-size: 10px; font-weight: 700; color: #333; margin-bottom: 6px; text-transform: uppercase; font-family: 'IBM Plex Sans', sans-serif; }
  .pf-url-row { display: flex; gap: 4px; align-items: center; margin-bottom: 8px; }
  .pf-method-sel {
    height: 22px; padding: 0 6px; font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    border: 1px solid; border-color: #808080 #fff #fff #808080;
    background: #d4d0c8; outline: none; cursor: pointer;
  }
  .pf-url-input {
    flex: 1; height: 22px; padding: 0 6px; font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    border: 1px solid; border-color: #808080 #fff #fff #808080;
    background: white; outline: none;
  }
  .pf-send-btn {
    padding: 0 12px; height: 22px; font-size: 11px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600;
    background: #1a6bb5; color: white; border: 1px solid;
    border-color: #5b9bd5 #0d4a8a #0d4a8a #5b9bd5;
    cursor: pointer;
  }
  .pf-send-btn:active { border-color: #0d4a8a #5b9bd5 #5b9bd5 #0d4a8a; }
  .pf-lifecycle { display: flex; gap: 4px; margin-top: 4px; }
  .pf-lc-step { flex: 1; padding: 4px 6px; background: #c8c5bc; border: 1px solid #aaa; }
  .pf-lc-step .lc-label { font-size: 9px; font-weight: 700; color: #555; text-transform: uppercase; margin-bottom: 2px; font-family: 'IBM Plex Sans', sans-serif; }
  .pf-lc-step .lc-val { font-size: 10px; color: #888; }
  .pf-response { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 8px; }
  .pf-resp-header { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
  .pf-resp-tab {
    padding: 2px 10px; font-size: 10px; font-weight: 600; cursor: pointer;
    border: 1px solid #808080; font-family: 'IBM Plex Sans', sans-serif;
  }
  .pf-resp-tab.active { background: #1a6bb5; color: white; border-color: #0d4a8a; }
  .pf-resp-tab:not(.active) { background: #d4d0c8; color: #333; }
  .pf-resp-status { margin-left: auto; font-size: 10px; font-family: 'IBM Plex Mono', monospace; }
  .pf-resp-status.ok { color: #1a8a3a; }
  .pf-resp-status.pending { color: #888; }
  .pf-json-area {
    flex: 1; background: white; border: 1px solid; border-color: #808080 #fff #fff #808080;
    padding: 8px; overflow-y: auto; font-size: 11px; line-height: 1.5;
    font-family: 'IBM Plex Mono', monospace;
  }
  .json-key { color: #9c27b0; }
  .json-str { color: #1a6bb5; }
  .json-num { color: #e91e63; }
  .json-bool { color: #ff6d00; }
  .pf-sidebar-right { width: 170px; flex-shrink: 0; border-left: 1px solid #808080; display: flex; flex-direction: column; }
  .pf-vars { padding: 8px; flex: 1; }
  .pf-env-header { font-size: 10px; font-weight: 700; color: #333; margin-bottom: 6px; text-transform: uppercase; font-family: 'IBM Plex Sans', sans-serif; }
  .pf-env-row { display: flex; margin-bottom: 4px; border: 1px solid #aaa; }
  .pf-env-key, .pf-env-val { padding: 2px 4px; font-size: 10px; background: white; border: none; outline: none; font-family: 'IBM Plex Mono', monospace; }
  .pf-env-key { width: 60px; border-right: 1px solid #aaa; color: #333; }
  .pf-env-val { flex: 1; color: #1a6bb5; }
  .pf-history { border-top: 1px solid #808080; padding: 6px 8px; }
  .pf-history-header { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
  .pf-history-title { font-size: 10px; font-weight: 700; color: #333; text-transform: uppercase; flex: 1; font-family: 'IBM Plex Sans', sans-serif; }
  .pf-history-btn { padding: 1px 6px; font-size: 9px; background: #d4d0c8; border: 1px solid; border-color: #fff #808080 #808080 #fff; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; }
  .pf-hist-item { padding: 4px 0; border-bottom: 1px solid #e0e0e0; cursor: pointer; }
  .pf-hist-item:hover { color: #2a6496; }
  .pf-hist-path { font-size: 10px; color: #2a6496; font-weight: 600; }
  .pf-hist-time { font-size: 9px; color: #888; margin-top: 1px; }

  /* ═══════════════════════════════════════
     APP: NOTEPAD

  /* ── Clock ── */

  /* ── Boot screen ── */

  @keyframes boot-fill { from { width: 0%; } to { width: 100%; } }
</style>
</head>

<script>
// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let zCounter = 100;
let windows = {};
let taskbarBtns = {};

const appDefs = {
  explorer: { title: '📁 File Explorer', icon: '📁', w: 680, h: 440 },
  browser:  { title: '🌐 Browser', icon: '🌐', w: 720, h: 500 },
  spotify:  { title: '🎵 Spotify', icon: '🎵', w: 640, h: 480 },
  terminal: { title: '⬛ Terminal', icon: '⬛', w: 560, h: 380 },
  portfolio:{ title: '📡 API Studio — portfolio endpoints · simulated network', icon: '📡', w: 860, h: 520 },
  notepad:  { title: '📝 Notepad — untitled.txt', icon: '📝', w: 460, h: 360 },
};

// ═══════════════════════════════════
// BOOT
// ═══════════════════════════════════
setTimeout(() => {
  const bs = document.getElementById('bootscreen');
  bs.style.opacity = '0';
  setTimeout(() => bs.remove(), 500);
}, 2200);

// ═══════════════════════════════════
// CLOCK
// ═══════════════════════════════════
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = h + ':' + m;
}
updateClock();
setInterval(updateClock, 10000);

// ═══════════════════════════════════
// DESKTOP ICON SELECT
// ═══════════════════════════════════
function selectIcon(el) {
  document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
}
document.getElementById('desktop').addEventListener('click', (e) => {
  if (!e.target.closest('.desktop-icon')) {
    document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
  }
  hideCtx();
});

// ═══════════════════════════════════
// CONTEXT MENU
// ═══════════════════════════════════
document.getElementById('desktop').addEventListener('contextmenu', (e) => {
  if (e.target.closest('.window')) return;
  e.preventDefault();
  const menu = document.getElementById('ctx-menu');
  menu.style.display = 'block';
  menu.style.left = Math.min(e.clientX, window.innerWidth - menu.offsetWidth - 4) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - menu.offsetHeight - 40) + 'px';
});
function hideCtx() { document.getElementById('ctx-menu').style.display = 'none'; }
document.addEventListener('click', hideCtx);

// ═══════════════════════════════════
// OPEN APP
// ═══════════════════════════════════
function openApp(id) {
  if (windows[id]) {
    const win = windows[id];
    win.classList.remove('minimized');
    focusWindow(win, id);
    return;
  }
  createWindow(id);
}

function createWindow(id) {
  const def = appDefs[id];
  const desktop = document.getElementById('desktop');
  const dw = desktop.clientWidth;
  const dh = desktop.clientHeight;

  const win = document.createElement('div');
  win.className = 'window focused';
  win.id = 'win-' + id;
  win.style.width = def.w + 'px';
  win.style.height = def.h + 'px';
  // Stagger windows
  const offset = Object.keys(windows).length * 24;
  win.style.left = Math.max(40, Math.min((dw - def.w) / 2 + offset, dw - def.w - 40)) + 'px';
  win.style.top = Math.max(20, Math.min((dh - def.h) / 2 + offset, dh - def.h - 20)) + 'px';
  win.style.zIndex = ++zCounter;

  win.innerHTML = buildWindowHTML(id, def);

  desktop.appendChild(win);
  windows[id] = win;

  makeDraggable(win, id);
  makeResizable(win);
  addTaskbarBtn(id, def);
  focusWindow(win, id);
}

// ═══════════════════════════════════
// BUILD WINDOW HTML
// ═══════════════════════════════════
function buildWindowHTML(id, def) {
  const content = buildAppContent(id);
  return `
    <div class="win-titlebar" id="tb-${id}">
      <span class="win-title">${def.title}</span>
      <div class="win-controls">
        <div class="win-btn lt" title="Light mode">Lt</div>
        <div class="win-btn dk" title="Dark mode">Dk</div>
        <div class="win-btn" onclick="minimizeWin('${id}')" title="Minimize">─</div>
        <div class="win-btn" onclick="maximizeWin('${id}')" title="Maximize">□</div>
        <div class="win-btn close" onclick="closeWin('${id}')" title="Close">✕</div>
      </div>
    </div>
    <div class="win-menubar">
      <span class="menu-item">File</span>
      <span class="menu-item">Edit</span>
      <span class="menu-item">View</span>
      <span class="menu-item">Help</span>
    </div>
    <div class="win-body" id="body-${id}">
      ${content}
    </div>
    <div class="win-resize"></div>
  `;
}

function buildAppContent(id) {
  switch(id) {
    case 'explorer': return buildExplorer();
    case 'browser':  return buildBrowser();
    case 'spotify':  return buildSpotify();
    case 'terminal': return buildTerminal();
    case 'portfolio':return buildPortfolio();
    case 'notepad':  return buildNotepad();
    default: return '<div style="padding:20px;color:#555;">App content</div>';
  }
}

// ═══════════════════════════════════
// BROWSER
// ═══════════════════════════════════
function buildBrowser() {
  return `
    <div class="browser-tabs">
      <div class="browser-tab active">New Tab</div>
      <div class="browser-tab" style="font-size:10px;padding:3px 8px;">+ New Tab</div>
    </div>

      <button title="Back">◀</button>
      <button title="Forward">▶</button>

function navigate() {

  const page = document.getElementById('browser-page');

}

// ═══════════════════════════════════
// SPOTIFY
// ═══════════════════════════════════
const tracks = [
  {name:'Midnight City', artist:'M83', cover:'🌃'},
  {name:'Tame Impala', artist:'The Less I Know…', cover:'🌀'},
  {name:'Feels', artist:'Calvin Harris', cover:'✨'},
  {name:'Motion Picture', artist:'OST', cover:'🎬'},
  {name:'Blinding Lights', artist:'The Weeknd', cover:'🌆'},
  {name:'Lost in the Fire', artist:'Gesaffelstein', cover:'🔥'},
];
let isPlaying = false;
let currentTrack = 0;
let progressVal = 35;
let progressTimer;

function buildSpotify() {
  return `
    <div class="spotify-layout" style="position:relative">
      <div class="spotify-sidebar">
        <div class="sp-section">Library</div>
        <div class="sp-nav-item active"><span class="sp-icon">🏠</span> Home</div>
        <div class="sp-nav-item"><span class="sp-icon">🔍</span> Search</div>
        <div class="sp-nav-item"><span class="sp-icon">📚</span> Your Library</div>
        <div class="sp-section" style="margin-top:8px">Playlists</div>
        <div class="sp-nav-item"><span class="sp-icon">❤️</span> Liked Songs</div>
        <div class="sp-nav-item"><span class="sp-icon">🎵</span> Chill Vibes</div>
        <div class="sp-nav-item"><span class="sp-icon">🌙</span> Night Drive</div>
        <div class="sp-nav-item"><span class="sp-icon">⚡</span> Energy Mix</div>
        <div class="sp-nav-item"><span class="sp-icon">🎸</span> Indie Rock</div>
      </div>
      <div class="spotify-main" style="padding-bottom:80px">
        <div class="sp-hero">
          <h2>Good evening 🌙</h2>
          <p>Pick up where you left off</p>
        </div>
        <div class="sp-section-title">Recently Played</div>
        <div class="sp-grid">
          ${tracks.map((t,i) => `
            <div class="sp-card" onclick="playTrack(${i})">
              <div class="sp-cover">${t.cover}</div>
              <div class="sp-card-name">${t.name}</div>
              <div class="sp-card-sub">${t.artist}</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="spotify-player" id="sp-player">
        <div class="sp-now">
          <div class="sp-thumb" id="sp-thumb">🎵</div>
          <div class="sp-track-info">
            <div class="sp-track-name" id="sp-track-name">No track selected</div>
            <div class="sp-track-artist" id="sp-track-artist">—</div>
          </div>
        </div>
        <div class="sp-center">
          <div class="sp-controls">
            <button class="sp-ctrl-btn" onclick="prevTrack()">⏮</button>
            <button class="sp-play-btn" id="sp-play-btn" onclick="togglePlay()">▶</button>
            <button class="sp-ctrl-btn" onclick="nextTrack()">⏭</button>
          </div>
          <div class="sp-progress">
            <span class="sp-time">1:24</span>
            <div class="sp-bar" onclick="seekTrack(event, this)">
              <div class="sp-bar-fill" id="sp-bar-fill" style="width:${progressVal}%"></div>
            </div>
            <span class="sp-time">3:52</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

function playTrack(i) {
  currentTrack = i;
  const t = tracks[i];
  const nameEl = document.getElementById('sp-track-name');
  const artistEl = document.getElementById('sp-track-artist');
  const thumbEl = document.getElementById('sp-thumb');
  if (nameEl) nameEl.textContent = t.name;
  if (artistEl) artistEl.textContent = t.artist;
  if (thumbEl) thumbEl.textContent = t.cover;
  isPlaying = true;
  updatePlayBtn();
  startProgress();
}
function togglePlay() {
  isPlaying = !isPlaying;
  updatePlayBtn();
  if (isPlaying) startProgress(); else clearInterval(progressTimer);
}
function updatePlayBtn() {
  const btn = document.getElementById('sp-play-btn');
  if (btn) btn.textContent = isPlaying ? '⏸' : '▶';
}
function nextTrack() { playTrack((currentTrack + 1) % tracks.length); }
function prevTrack() { playTrack((currentTrack - 1 + tracks.length) % tracks.length); }
function startProgress() {
  clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    progressVal = Math.min(100, progressVal + 0.5);
    const fill = document.getElementById('sp-bar-fill');
    if (fill) fill.style.width = progressVal + '%';
    if (progressVal >= 100) { progressVal = 0; nextTrack(); }
  }, 200);
}
function seekTrack(e, bar) {
  const rect = bar.getBoundingClientRect();
  progressVal = ((e.clientX - rect.left) / rect.width) * 100;
  const fill = document.getElementById('sp-bar-fill');
  if (fill) fill.style.width = progressVal + '%';
}

  open: (args) => {

  },
  neofetch: () => {
    return [
      '      ◈◈◈◈◈◈◈      user@retrodesk',
      '    ◈◈◈◈◈◈◈◈◈◈◈    ──────────────',
      '  ◈◈◈◈◈◈◈◈◈◈◈◈◈◈◈  OS: RetroDesk OS 1.0.4',
      '  ◈◈◈◈  ◈◈◈  ◈◈◈◈  Shell: retrosh 2.1',
      '  ◈◈◈◈◈◈◈◈◈◈◈◈◈◈◈  Resolution: ' + window.innerWidth + 'x' + window.innerHeight,
      '    ◈◈◈◈◈◈◈◈◈◈◈    Theme: Teal Classic',
      '      ◈◈◈◈◈◈◈      Font: IBM Plex Mono',
    ].join('\n');
  },
};

function termKey(e) {
  const input = document.getElementById('term-input');
  if (!input) return;
  if (e.key === 'Enter') {
    const raw = input.value.trim();
    input.value = '';
    if (!raw) { termPrint(''); return; }
    termHistory.unshift(raw);
    termHistIdx = -1;
    termPrint(`user@retrodesk:~$ ${raw}`, 'prompt');
    const [cmd, ...args] = raw.split(' ');
    if (termCmds[cmd]) {
      const result = termCmds[cmd](args);
      if (result === '__CLEAR__') { clearTerm(); return; }
      if (result) result.split('\n').forEach(l => termPrint(l, 'output'));
    } else {
      termPrint(`bash: ${cmd}: command not found`, 'error');
    }
    termPrint('');
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (termHistIdx < termHistory.length - 1) {
      termHistIdx++;
      input.value = termHistory[termHistIdx];
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (termHistIdx > 0) { termHistIdx--; input.value = termHistory[termHistIdx]; }
    else { termHistIdx = -1; input.value = ''; }
  }
}

function termPrint(text, cls = '') {
  const out = document.getElementById('term-out');
  if (!out) return;
  const inputRow = out.querySelector('.term-input-row');
  const line = document.createElement('div');
  line.className = 'term-line ' + cls;
  line.textContent = text;
  out.insertBefore(line, inputRow);
  out.scrollTop = out.scrollHeight;
}
function clearTerm() {
  const out = document.getElementById('term-out');
  if (!out) return;
  const inputRow = out.querySelector('.term-input-row');
  out.innerHTML = '';
  out.appendChild(inputRow);
}

function pfSelect(i) {
  pfActive = i;
  document.querySelectorAll('.pf-endpoint-item').forEach((el,j) => {
    el.classList.toggle('active', j===i);
  });
  const urlInput = document.getElementById('pf-url');
  if (urlInput) urlInput.value = '{{baseUrl}}' + pfEndpoints[i].path;
}

function pfSend() {
  const url = document.getElementById('pf-url');
  const json = document.getElementById('pf-json');
  const status = document.getElementById('pf-status');
  const lc1 = document.getElementById('pf-lc1');
  const lc2 = document.getElementById('pf-lc2');
  const lc3 = document.getElementById('pf-lc3');
  if (!url || !json) return;

  const path = pfEndpoints[pfActive].path;
  const ms = Math.floor(Math.random() * 40) + 10;

  if (lc1) lc1.textContent = '●';
  if (lc2) lc2.textContent = '—';
  if (lc3) lc3.textContent = '—';
  if (status) { status.textContent = 'Processing...'; status.className = 'pf-resp-status pending'; }
  if (json) { json.innerHTML = '<span style="color:#aaa">// Fetching...</span>'; }

  setTimeout(() => {
    if (lc2) lc2.textContent = '●';
  }, ms / 2);

  setTimeout(() => {
    if (lc1) lc1.textContent = '✓';
    if (lc2) lc2.textContent = '✓';
    if (lc3) lc3.textContent = '✓';
    if (status) { status.textContent = `200 OK · ${ms}ms`; status.className = 'pf-resp-status ok'; }
    const data = pfResponses[path];
    if (json) json.innerHTML = syntaxHighlight(JSON.stringify(data, null, 2));

    pfHistory.unshift({ path, ms, time: new Date().toISOString() });
    renderPfHistory();
  }, ms * 8);
}

function syntaxHighlight(str) {
  return str
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, (m) => {
      if (/^"/.test(m)) {
        if (/:$/.test(m)) return `<span class="json-key">${m}</span>`;
        return `<span class="json-str">${m}</span>`;
      }
      if (/true|false/.test(m)) return `<span class="json-bool">${m}</span>`;
      if (/null/.test(m)) return `<span class="json-bool">${m}</span>`;
      return `<span class="json-num">${m}</span>`;
    });
}

function renderPfHistory() {
  const list = document.getElementById('pf-hist-list');

      <div class="pf-hist-time">${h.time.replace('T','T').slice(0,23)}Z &nbsp; ${h.ms}ms</div>

}
function pfClearHistory() {

// ═══════════════════════════════════
// WINDOW MANAGEMENT
// ═══════════════════════════════════
function focusWindow(win, id) {
  document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
  win.classList.add('focused');
  win.style.zIndex = ++zCounter;
  Object.keys(taskbarBtns).forEach(k => taskbarBtns[k].classList.remove('active'));
  if (taskbarBtns[id]) taskbarBtns[id].classList.add('active');
}

function closeWin(id) {
  const win = document.getElementById('win-' + id);
  if (win) win.remove();
  delete windows[id];
  const btn = taskbarBtns[id];
  if (btn) btn.remove();
  delete taskbarBtns[id];
  clearInterval(progressTimer);
}

function minimizeWin(id) {
  const win = windows[id];
  if (!win) return;
  win.classList.add('minimized');
  if (taskbarBtns[id]) taskbarBtns[id].classList.remove('active');
}

let maximizedStates = {};
function maximizeWin(id) {
  const win = windows[id];
  if (!win) return;
  const desktop = document.getElementById('desktop');
  if (!maximizedStates[id]) {
    maximizedStates[id] = { left: win.style.left, top: win.style.top, width: win.style.width, height: win.style.height };
    win.style.left = '0'; win.style.top = '0';
    win.style.width = desktop.clientWidth + 'px';
    win.style.height = desktop.clientHeight + 'px';
  } else {
    const s = maximizedStates[id];
    win.style.left = s.left; win.style.top = s.top;
    win.style.width = s.width; win.style.height = s.height;
    delete maximizedStates[id];
  }
}

// ═══════════════════════════════════
// TASKBAR BUTTON
// ═══════════════════════════════════
function addTaskbarBtn(id, def) {
  const apps = document.getElementById('taskbar-apps');
  const btn = document.createElement('button');
  btn.className = 'taskbar-btn active';
  btn.id = 'tb-btn-' + id;
  btn.innerHTML = `<span class="tb-icon">${def.icon}</span> ${def.title.slice(def.title.indexOf(' ')+1).split('—')[0].trim().slice(0,18)}`;
  btn.onclick = () => {
    const win = windows[id];
    if (!win) return;
    if (win.classList.contains('minimized')) {
      win.classList.remove('minimized');
      focusWindow(win, id);
    } else if (win.classList.contains('focused')) {
      minimizeWin(id);
    } else {
      focusWindow(win, id);
    }
  };
  apps.appendChild(btn);
  taskbarBtns[id] = btn;
}

// ═══════════════════════════════════
// DRAGGABLE
// ═══════════════════════════════════
function makeDraggable(win, id) {
  const titlebar = win.querySelector('.win-titlebar');
  let dragging = false, ox, oy;

  titlebar.addEventListener('mousedown', (e) => {
    if (e.target.closest('.win-btn')) return;
    dragging = true;
    ox = e.clientX - win.offsetLeft;
    oy = e.clientY - win.offsetTop;
    focusWindow(win, id);
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const desktop = document.getElementById('desktop');
    const maxX = desktop.clientWidth - win.offsetWidth;
    const maxY = desktop.clientHeight - win.offsetHeight;
    win.style.left = Math.max(0, Math.min(e.clientX - ox, maxX)) + 'px';
    win.style.top = Math.max(0, Math.min(e.clientY - oy, maxY)) + 'px';
  });

  document.addEventListener('mouseup', () => { dragging = false; });

  win.addEventListener('mousedown', (e) => {
    if (!e.target.closest('.win-btn')) focusWindow(win, id);
  });
}

// ═══════════════════════════════════
// RESIZABLE
// ═══════════════════════════════════
function makeResizable(win) {
  const handle = win.querySelector('.win-resize');
  let resizing = false, startX, startY, startW, startH;

  handle.addEventListener('mousedown', (e) => {
    resizing = true;
    startX = e.clientX; startY = e.clientY;
    startW = win.offsetWidth; startH = win.offsetHeight;
    e.preventDefault(); e.stopPropagation();
  });

  document.addEventListener('mousemove', (e) => {
    if (!resizing) return;
    const nw = Math.max(300, startW + (e.clientX - startX));
    const nh = Math.max(200, startH + (e.clientY - startY));
    win.style.width = nw + 'px';
    win.style.height = nh + 'px';
  });

  document.addEventListener('mouseup', () => { resizing = false; });
}
